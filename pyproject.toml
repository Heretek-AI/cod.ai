[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-ai"
version = "0.2.0"
description = "A terminal and web coding agent built on the Claude Messages API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Heretek-AI", email = "argon@heretek.ai"}]
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
cod = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.agent", "src.agents"]
